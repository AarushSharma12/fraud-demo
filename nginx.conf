# Nginx Reverse Proxy Configuration for Fraud Detection Demo
# This file should be placed in /etc/nginx/sites-available/ or /etc/nginx/conf.d/
# Then symlink to /etc/nginx/sites-enabled/ and reload nginx

server {
    listen 443 ssl http2;
    server_name attu2.cs.washington.edu;

    # SSL Certificate Configuration
    # Option 1: Use Let's Encrypt (recommended)
    # ssl_certificate /etc/letsencrypt/live/attu2.cs.washington.edu/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/attu2.cs.washington.edu/privkey.pem;
    
    # Option 2: Use existing certificate (if trusted)
    ssl_certificate /homes/iws/micibr/ssl/attu2.cs.washington.edu.crt;
    ssl_certificate_key /homes/iws/micibr/ssl/attu2.cs.washington.edu.key;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Logging
    access_log /var/log/nginx/fraud-demo-access.log;
    error_log /var/log/nginx/fraud-demo-error.log;

    # Proxy settings
    client_max_body_size 10M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;

    # Reverse proxy to backend (running on HTTP)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support (if needed in future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# Optional: Redirect HTTP to HTTPS
server {
    listen 80;
    server_name attu2.cs.washington.edu;
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}



